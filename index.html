<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('ns-theme');
          if (preference !== 'light' && preference !== 'dark' && preference !== 'system') {
            preference = 'light';
          }
          var isDark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#0E1A22' : '#FFFFFF');
        } catch (_) {}
      })();
    </script>
    <link rel="manifest" href="/s_n_diving/manifest.webmanifest" />
    <link rel="icon" href="/s_n_diving/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/s_n_diving/icons/apple-touch-icon.png" />
    <meta name="description" content="ダイビング情報の共有サイト。仲間どうしで知識や経験を共有し、より理解を深めて、安全に楽しく潜れるようにしたい。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet" />
    <title>N×S_Diving</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
