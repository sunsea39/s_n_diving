<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="いちばん膨らむのは水面近く（10m→0m）">
  <rect x="1" y="1" width="638" height="358" rx="16" fill="#FFFFFF" stroke="#D5E6EA" stroke-width="2"/>
  <text x="24" y="38" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#0B3C5D" text-anchor="start">いちばん膨らむのは水面近く（10m→0m）</text>
  <rect x="80" y="252" width="64" height="48" rx="6" fill="#1B998B"/><text x="112" y="244" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="16" font-weight="700" fill="#1B998B" text-anchor="middle">3ℓ</text><text x="112" y="322" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="400" fill="#4F5B62" text-anchor="middle">30m</text><rect x="210" y="236" width="64" height="64" rx="6" fill="#1B998B"/><text x="242" y="228" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="16" font-weight="700" fill="#1B998B" text-anchor="middle">4ℓ</text><text x="242" y="322" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="400" fill="#4F5B62" text-anchor="middle">20m</text><rect x="340" y="204" width="64" height="96" rx="6" fill="#1B998B"/><text x="372" y="196" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="16" font-weight="700" fill="#1B998B" text-anchor="middle">6ℓ</text><text x="372" y="322" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="400" fill="#4F5B62" text-anchor="middle">10m</text><rect x="470" y="108" width="64" height="192" rx="6" fill="#D64527"/><text x="502" y="100" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="16" font-weight="700" fill="#D64527" text-anchor="middle">12ℓ</text><text x="502" y="322" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="400" fill="#4F5B62" text-anchor="middle">水面</text><rect x="24" y="56" width="300" height="54" rx="10" fill="#FBE4DE"/><text x="40" y="80" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#D64527" text-anchor="start">10m→水面で体積は2倍に</text><text x="40" y="100" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="400" fill="#D64527" text-anchor="start">浮上中は絶対に息を止めない</text>
</svg>