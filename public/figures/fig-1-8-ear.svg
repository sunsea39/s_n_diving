    <rect x="356" y="160" width="100" height="40" fill="#CDEBE5"/><text x="406" y="230" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="middle">外耳（水圧）</text>
