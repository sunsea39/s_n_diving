<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="減圧症は炭酸飲料のふたを開けたときに似ている">
  <rect x="1" y="1" width="638" height="358" rx="16" fill="#FFFFFF" stroke="#D5E6EA" stroke-width="2"/>
  <text x="24" y="38" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#0B3C5D" text-anchor="start">減圧症は炭酸飲料のふたを開けたときに似ている</text>
  <rect x="70" y="90" width="90" height="190" rx="22" fill="#CDEBE5" stroke="#0B3C5D" stroke-width="3"/><rect x="98" y="66" width="34" height="28" rx="4" fill="#1B998B"/><circle cx="115" cy="230" r="4" fill="none" stroke="#7FC9BF" stroke-width="2"/><circle cx="100" cy="180" r="3" fill="none" stroke="#7FC9BF" stroke-width="2"/><text x="115" y="310" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#0B3C5D" text-anchor="middle">ゆっくり開ける</text><rect x="250" y="90" width="90" height="190" rx="22" fill="#CDEBE5" stroke="#0B3C5D" stroke-width="3"/><rect x="278" y="66" width="34" height="28" rx="4" fill="#D64527"/><circle cx="270" cy="250" r="6" fill="none" stroke="#7FC9BF" stroke-width="2"/><circle cx="300" cy="230" r="8" fill="none" stroke="#7FC9BF" stroke-width="2"/><circle cx="320" cy="200" r="5" fill="none" stroke="#7FC9BF" stroke-width="2"/><circle cx="280" cy="190" r="7" fill="none" stroke="#7FC9BF" stroke-width="2"/><circle cx="310" cy="160" r="6" fill="none" stroke="#7FC9BF" stroke-width="2"/><circle cx="290" cy="130" r="5" fill="none" stroke="#7FC9BF" stroke-width="2"/><circle cx="320" cy="120" r="7" fill="none" stroke="#7FC9BF" stroke-width="2"/><circle cx="270" cy="150" r="4" fill="none" stroke="#7FC9BF" stroke-width="2"/><text x="295" y="310" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#0B3C5D" text-anchor="middle">急に開ける</text><rect x="380" y="90" width="236" height="190" rx="12" fill="#EEF5F6"/>
    <text x="396" y="120" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="15" font-weight="700" fill="#0B3C5D" text-anchor="start">体の中でも同じ</text>
    <text x="396" y="150" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="400" fill="#4F5B62" text-anchor="start">潜ると窒素が体に溶け込む</text>
    <text x="396" y="176" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="400" fill="#D64527" text-anchor="start">急に浮上すると泡になる</text>
    <text x="396" y="214" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#1B998B" text-anchor="start">ゆっくり浮上＋安全停止で</text>
    <text x="396" y="238" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#1B998B" text-anchor="start">少しずつ抜く</text>
</svg>