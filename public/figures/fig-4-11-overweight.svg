<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="ウエイトが重すぎると、かえって疲れる">
  <rect x="1" y="1" width="638" height="358" rx="16" fill="#FFFFFF" stroke="#D5E6EA" stroke-width="2"/>
  <text x="24" y="38" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#0B3C5D" text-anchor="start">ウエイトが重すぎると、かえって疲れる</text>
  
  <rect x="24" y="60" width="286" height="240" rx="12" fill="#E3F4EF"/><text x="167" y="90" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="15" font-weight="700" fill="#1B998B" text-anchor="middle">◎ 適正ウエイト</text>
  <g transform="translate(170 190) rotate(0) scale(0.85)">
