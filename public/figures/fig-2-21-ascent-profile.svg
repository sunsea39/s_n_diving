<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="ゆっくり浮上し、安全停止をする">
  <rect x="1" y="1" width="638" height="358" rx="16" fill="#FFFFFF" stroke="#D5E6EA" stroke-width="2"/>
  <text x="24" y="38" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#0B3C5D" text-anchor="start">ゆっくり浮上し、安全停止をする</text>
  <line x1="70" y1="80" x2="510" y2="80" stroke="#7FC9BF" stroke-width="3"/><text x="510" y="72" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="end">水面</text><line x1="70" y1="115" x2="510" y2="115" stroke="#D5E6EA"/><text x="62" y="119" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="11" font-weight="400" fill="#7A8A92" text-anchor="end">5m</text><line x1="70" y1="150" x2="510" y2="150" stroke="#D5E6EA"/><text x="62" y="154" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="11" font-weight="400" fill="#7A8A92" text-anchor="end">10m</text><line x1="70" y1="185" x2="510" y2="185" stroke="#D5E6EA"/><text x="62" y="189" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="11" font-weight="400" fill="#7A8A92" text-anchor="end">15m</text><line x1="70" y1="220" x2="510" y2="220" stroke="#D5E6EA"/><text x="62" y="224" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="11" font-weight="400" fill="#7A8A92" text-anchor="end">20m</text><line x1="70" y1="255" x2="510" y2="255" stroke="#D5E6EA"/><text x="62" y="259" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="11" font-weight="400" fill="#7A8A92" text-anchor="end">25m</text><rect x="433" y="101" width="33" height="28" fill="#F3C969" opacity=".5"/><path d="M70 80 L103 255 L400 255 L433 115 L466 115 L477 80" fill="none" stroke="#0B3C5D" stroke-width="4" stroke-linejoin="round"/><line x1="400" y1="255" x2="433" y2="115" stroke="#1B998B" stroke-width="6" stroke-linecap="round" opacity=".6"/><text x="312" y="185" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#1B998B" text-anchor="start">ゆっくり浮上</text><text x="312" y="203" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="start">（毎分9m以下が目安）</text><text x="483" y="119" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#D98E04" text-anchor="start">安全停止</text><text x="483" y="137" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="start">5m付近で3分</text><text x="24" y="345" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#7A8A92" text-anchor="start">※ 浮上速度・停止時間はダイブコンピューターの表示とガイドの指示に従う</text>
</svg>