 font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="middle">〜10m</text><rect x="398" y="70" width="30" height="220" rx="6" fill="#F3C94A"/><text x="413" y="62" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#0B3C5D" text-anchor="middle">黄</text><text x="413" y="310" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="middle">〜20m</text><rect x="462" y="70" width="30" height="242" rx="6" fill="#3BAA5C"/><text x="477" y="62" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#0B3C5D" text-anchor="middle">緑</text><text x="477" y="332" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="middle">深くまで</text><rect x="526" y="70" width="30" height="242" rx="6" fill="#2F6FD6"/><text x="541" y="62" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#0B3C5D" text-anchor="middle">青</text><text x="541" y="332" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="middle">深くまで</text><text x="24" y="368" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#7A8A92" text-anchor="start">※ 目安。天気や水の濁りで変わる。本当の色はライトで照らすと戻る</text>
