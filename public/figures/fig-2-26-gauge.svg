ans-serif" font-size="13" font-weight="700" fill="#0B3C5D" text-anchor="middle">300</text><line x1="200" y1="205" x2="112.50280050084588" y2="176.57043651750482" stroke="#0B3C5D" stroke-width="5" stroke-linecap="round"/><circle cx="200" cy="205" r="8" fill="#0B3C5D"/><text x="200" y="265" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="400" fill="#4F5B62" text-anchor="middle">bar</text><rect x="370" y="90" width="246" height="190" rx="12" fill="#EEF5F6"/>
