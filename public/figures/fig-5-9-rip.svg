<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-label="離岸流に流されたら、岸と平行に泳ぐ">
  <rect x="1" y="1" width="638" height="368" rx="16" fill="#FFFFFF" stroke="#D5E6EA" stroke-width="2"/>
  <text x="24" y="38" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#0B3C5D" text-anchor="start">離岸流に流されたら、岸と平行に泳ぐ</text>
  
  <rect x="24" y="60" width="592" height="200" rx="10" fill="#CDEBE5"/>
  <rect x="24" y="260" width="592" height="70" rx="10" fill="#E9DFC6"/><text x="320" y="305" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#4F5B62" text-anchor="middle">岸（砂浜）</text>
  <path d="M60 240 q20 -12 40 0 t40 0" fill="none" stroke="#FFFFFF" stroke-width="3"/><path d="M140 240 q20 -12 40 0 t40 0" fill="none" stroke="#FFFFFF" stroke-width="3"/><path d="M420 240 q20 -12 40 0 t40 0" fill="none" stroke="#FFFFFF" stroke-width="3"/><path d="M500 240 q20 -12 40 0 t40 0" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M290 262 L290 110 Q320 80 350 110 L350 262 Z" fill="#15717A" opacity=".35"/>
  <line x1="320" y1="250" x2="320" y2="100" stroke="#D64527" stroke-width="4" stroke-linecap="round"/><polygon points="320,100 324.3496553411123,109.00447102352678 315.6503446588877,109.00447102352678" fill="#D64527"/><text x="320" y="90" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#D64527" text-anchor="middle">離岸流（沖へ速く流れる）</text>
  <g transform="translate(320 170) rotate(-90) scale(0.45)">
  <rect x="-10" y="-17" width="40" height="11" rx="5.5" fill="#D98E04"/>
  <rect x="-30" y="-8" width="62" height="18" rx="9" fill="#0B3C5D"/>
  <circle cx="42" cy="-1" r="10" fill="#0B3C5D"/>
  <rect x="44" y="-6" width="10" height="7" rx="2" fill="#CDEBE5" stroke="#0B3C5D" stroke-width="2"/>
  <path d="M-30 -2 L-52 -10 L-56 2 L-30 6 Z" fill="#1B998B"/>
</g>
  <line x1="340" y1="170" x2="450" y2="170" stroke="#1B998B" stroke-width="4" stroke-linecap="round"/><polygon points="450,170 440.9955289764732,174.3496553411123 440.9955289764732,165.6503446588877" fill="#1B998B"/><text x="372" y="155" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#1B998B" text-anchor="start">① 岸と平行に泳ぐ</text>
  <line x1="470" y1="180" x2="440" y2="240" stroke="#1B998B" stroke-width="3" stroke-linecap="round"/><polygon points="440,240 440.13647185343774,230.0009312717024 447.91737187057544,233.89138128027125" fill="#1B998B"/><text x="480" y="215" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#1B998B" text-anchor="start">② 抜けたら岸へ</text>
  <text x="24" y="350" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#7A8A92" text-anchor="start">流れに逆らってまっすぐ岸へ泳ぐと体力を使い果たす。無理なら浮いて合図する</text>
</svg>