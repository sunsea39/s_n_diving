<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="ウェットスーツとドライスーツの保温のしくみ">
  <rect x="1" y="1" width="638" height="358" rx="16" fill="#FFFFFF" stroke="#D5E6EA" stroke-width="2"/>
  <text x="24" y="38" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#0B3C5D" text-anchor="start">ウェットスーツとドライスーツの保温のしくみ</text>
  
  <rect x="24" y="60" width="286" height="250" rx="12" fill="#EEF5F6"/><text x="167" y="90" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="15" font-weight="700" fill="#0B3C5D" text-anchor="middle">ウェットスーツ</text>
  <rect x="60" y="120" width="40" height="150" fill="#F2D4BD"/><text x="80" y="290" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="700" fill="#4F5B62" text-anchor="middle">体</text>
  <rect x="100" y="120" width="26" height="150" fill="#7FC9BF"/><text x="113" y="306" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="700" fill="#4F5B62" text-anchor="middle">水</text>
  <rect x="126" y="120" width="60" height="150" fill="#0B3C5D"/><circle cx="140" cy="140" r="5" fill="#CDEBE5"/><circle cx="162" cy="170" r="5" fill="#CDEBE5"/><circle cx="140" cy="200" r="5" fill="#CDEBE5"/><circle cx="162" cy="230" r="5" fill="#CDEBE5"/><circle cx="140" cy="255" r="5" fill="#CDEBE5"/>
  <text x="156" y="290" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="700" fill="#4F5B62" text-anchor="middle">生地（泡）</text>
  <text x="200" y="160" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="start">体温で温まった</text><text x="200" y="180" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="start">薄い水の層と、</text><text x="200" y="200" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="start">生地の泡で保温</text>
  <rect x="330" y="60" width="286" height="250" rx="12" fill="#EEF5F6"/><text x="473" y="90" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="15" font-weight="700" fill="#0B3C5D" text-anchor="middle">ドライスーツ</text>
  <rect x="366" y="120" width="40" height="150" fill="#F2D4BD"/><text x="386" y="290" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="700" fill="#4F5B62" text-anchor="middle">体</text>
  <rect x="406" y="120" width="40" height="150" fill="#E9DFC6"/><text x="426" y="306" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="700" fill="#4F5B62" text-anchor="middle">インナー</text>
  <rect x="446" y="120" width="20" height="150" fill="#0B3C5D"/><text x="456" y="290" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="700" fill="#4F5B62" text-anchor="middle">生地</text>
  <text x="478" y="160" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="start">水が入らず、</text><text x="478" y="180" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="start">空気の層と</text><text x="478" y="200" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="start">インナーで保温</text>
  <text x="24" y="340" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#7A8A92" text-anchor="start">ウェットスーツは潜ると泡がつぶれて薄くなり、保温力と浮力が下がる</text>
</svg>