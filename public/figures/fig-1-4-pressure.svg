<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="10m潜るごとに1気圧ふえる">
  <rect x="1" y="1" width="638" height="358" rx="16" fill="#FFFFFF" stroke="#D5E6EA" stroke-width="2"/>
  <text x="24" y="38" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#0B3C5D" text-anchor="start">10m潜るごとに1気圧ふえる</text>
  <rect x="90" y="260" width="70" height="50" fill="#CDEBE5" stroke="#7FC9BF"/><text x="125" y="250" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="16" font-weight="700" fill="#0B3C5D" text-anchor="middle">1気圧</text><text x="125" y="334" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="400" fill="#4F5B62" text-anchor="middle">水深0m</text><rect x="220" y="260" width="70" height="50" fill="#CDEBE5" stroke="#7FC9BF"/><rect x="220" y="210" width="70" height="50" fill="#1B998B"/><text x="255" y="200" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="16" font-weight="700" fill="#0B3C5D" text-anchor="middle">2気圧</text><text x="255" y="334" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="400" fill="#4F5B62" text-anchor="middle">水深10m</text><rect x="350" y="260" width="70" height="50" fill="#CDEBE5" stroke="#7FC9BF"/><rect x="350" y="160" width="70" height="100" fill="#1B998B"/><text x="385" y="150" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="16" font-weight="700" fill="#0B3C5D" text-anchor="middle">3気圧</text><text x="385" y="334" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="400" fill="#4F5B62" text-anchor="middle">水深20m</text><rect x="480" y="260" width="70" height="50" fill="#CDEBE5" stroke="#7FC9BF"/><rect x="480" y="110" width="70" height="150" fill="#1B998B"/><text x="515" y="100" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="16" font-weight="700" fill="#0B3C5D" text-anchor="middle">4気圧</text><text x="515" y="334" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="400" fill="#4F5B62" text-anchor="middle">水深30m</text><rect x="440" y="52" width="16" height="12" fill="#CDEBE5" stroke="#7FC9BF"/><text x="462" y="63" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="start">大気の重さ（1気圧）</text>
  <rect x="440" y="72" width="16" height="12" fill="#1B998B"/><text x="462" y="83" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="start">水の重さ（水圧）</text>
