<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="浮上中に息を止めると、肺が膨らみすぎる">
  <rect x="1" y="1" width="638" height="358" rx="16" fill="#FFFFFF" stroke="#D5E6EA" stroke-width="2"/>
  <text x="24" y="38" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#0B3C5D" text-anchor="start">浮上中に息を止めると、肺が膨らみすぎる</text>
  <g transform="translate(120 185) scale(1)"><path d="M-6 -60 v30 M6 -60 v30" stroke="#4F5B62" stroke-width="5"/>
      <path d="M-8 -30 C-60 -40 -70 40 -30 55 C-12 60 -8 30 -8 -30 Z M8 -30 C60 -40 70 40 30 55 C12 60 8 30 8 -30 Z" fill="#7FC9BF"/></g>
    <text x="120" y="300" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#0B3C5D" text-anchor="middle">呼吸を続ける</text><text x="120" y="320" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="middle">空気が抜けて安全</text><line x1="200" y1="185" x2="240" y2="185" stroke="#7A8A92" stroke-width="3" stroke-linecap="round"/><polygon points="240,185 230.99552897647322,189.3496553411123 230.99552897647322,180.6503446588877" fill="#7A8A92"/><g transform="translate(320 185) scale(1.2)"><path d="M-6 -60 v30 M6 -60 v30" stroke="#4F5B62" stroke-width="5"/>
      <path d="M-8 -30 C-60 -40 -70 40 -30 55 C-12 60 -8 30 -8 -30 Z M8 -30 C60 -40 70 40 30 55 C12 60 8 30 8 -30 Z" fill="#D98E04"/></g>
    <text x="320" y="300" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#0B3C5D" text-anchor="middle">息を止めて浮上</text><text x="320" y="320" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="middle">空気が膨らむ</text><line x1="410" y1="185" x2="450" y2="185" stroke="#7A8A92" stroke-width="3" stroke-linecap="round"/><polygon points="450,185 440.9955289764732,189.3496553411123 440.9955289764732,180.6503446588877" fill="#7A8A92"/><g transform="translate(520 185) scale(1.4)"><path d="M-6 -60 v30 M6 -60 v30" stroke="#4F5B62" stroke-width="5"/>
      <path d="M-8 -30 C-60 -40 -70 40 -30 55 C-12 60 -8 30 -8 -30 Z M8 -30 C60 -40 70 40 30 55 C12 60 8 30 8 -30 Z" fill="#D64527"/></g>
    <text x="520" y="300" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#D64527" text-anchor="middle">肺が傷つくおそれ</text><text x="520" y="320" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#4F5B62" text-anchor="middle">空気塞栓症など重い症状に</text>
</svg>