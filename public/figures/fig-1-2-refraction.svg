<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="マスク越しだと、大きく・近くに見える">
  <rect x="1" y="1" width="638" height="358" rx="16" fill="#FFFFFF" stroke="#D5E6EA" stroke-width="2"/>
  <text x="24" y="38" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#0B3C5D" text-anchor="start">マスク越しだと、大きく・近くに見える</text>
  
  <rect x="24" y="70" width="592" height="230" rx="10" fill="#CDEBE5"/>
  <g transform="translate(70 185)"><circle r="34" fill="#0B3C5D"/><rect x="16" y="-14" width="26" height="22" rx="5" fill="#EEF5F6" stroke="#0B3C5D" stroke-width="3"/></g>
  <text x="55" y="250" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#0B3C5D" text-anchor="start">ダイバー</text>
  <line x1="112" y1="185" x2="560" y2="185" stroke="#7A8A92" stroke-dasharray="6 6"/>
  <g transform="translate(470 185)"><path d="M0 0 c14-13 40-13 54 0 c-14 13-40 13-54 0z M54 0 l16-11 v22z" fill="#1B998B"/></g>
  <text x="500" y="225" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#1B998B" text-anchor="middle">実際の魚</text>
  <g transform="translate(330 185) scale(1.33)" opacity=".55"><path d="M0 0 c14-13 40-13 54 0 c-14 13-40 13-54 0z M54 0 l16-11 v22z" fill="#D98E04"/></g>
  <text x="370" y="145" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#D98E04" text-anchor="middle">見える魚（約4/3倍の大きさ）</text>
  <line x1="112" y1="280" x2="470" y2="280" stroke="#1B998B" stroke-width="3" stroke-linecap="round"/><polygon points="470,280 460.9955289764732,284.3496553411123 460.9955289764732,275.6503446588877" fill="#1B998B"/><text x="290" y="272" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="700" fill="#1B998B" text-anchor="middle">実際の距離</text>
  <line x1="112" y1="300" x2="330" y2="300" stroke="#D98E04" stroke-width="3" stroke-linecap="round"/><polygon points="330,300 320.9955289764732,304.3496553411123 320.9955289764732,295.6503446588877" fill="#D98E04"/><text x="220" y="318" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="700" fill="#D98E04" text-anchor="middle">見える距離（約3/4）</text>
  <text x="24" y="345" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#7A8A92" text-anchor="start">岩のすき間が「通れそう」に見えても、実際はもっと狭いことがある</text>
