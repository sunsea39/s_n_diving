<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="深いほど、同じタンクでも早く空気が減る">
  <rect x="1" y="1" width="638" height="358" rx="16" fill="#FFFFFF" stroke="#D5E6EA" stroke-width="2"/>
  <text x="24" y="38" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#0B3C5D" text-anchor="start">深いほど、同じタンクでも早く空気が減る</text>
  <text x="90" y="104" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#0B3C5D" text-anchor="end">水面</text><rect x="110" y="80" width="440" height="34" rx="8" fill="#7FC9BF"/><text x="560" y="103" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#0B3C5D" text-anchor="start">基準</text><text x="90" y="164" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#0B3C5D" text-anchor="end">10m</text><rect x="110" y="140" width="220" height="34" rx="8" fill="#1B998B"/><text x="340" y="163" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#0B3C5D" text-anchor="start">約1/2</text><text x="90" y="224" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#0B3C5D" text-anchor="end">20m</text><rect x="110" y="200" width="146.66666666666666" height="34" rx="8" fill="#1B998B"/><text x="266.66666666666663" y="223" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#0B3C5D" text-anchor="start">約1/3</text><text x="90" y="284" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#0B3C5D" text-anchor="end">30m</text><rect x="110" y="260" width="110" height="34" rx="8" fill="#1B998B"/><text x="230" y="283" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="700" fill="#0B3C5D" text-anchor="start">約1/4</text><text x="24" y="340" font-family="Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="400" fill="#7A8A92" text-anchor="start">1回の呼吸で吸う空気の量が、2気圧なら2倍、3気圧なら3倍になるため（目安の比率）</text>
</svg>